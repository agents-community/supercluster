serif" font-size="14" lengthAdjust="spacing" textLength="74.6826" x="1068.9492" y="517.1748">h-&lt;other&gt;</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="8" id="msg1"><polygon fill="#181818" points="372.8003,117.0234,382.8003,121.0234,372.8003,125.0234,376.8003,121.0234" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="121.0234" y2="121.0234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="38.2808" y="115.9575">POST /admin/identity  {session, actor}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="9" id="msg2"><polygon fill="#181818" points="708.1211,146.1563,718.1211,150.1563,708.1211,154.1563,712.1211,150.1563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="150.1563" y2="150.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.9214" x="391.8003" y="145.0903">Host: h-&lt;sid&gt;.agents&#8230;</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="10" id="msg3"><polygon fill="#181818" points="372.8003,175.2891,382.8003,179.2891,372.8003,183.2891,376.8003,179.2891" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="179.2891" y2="179.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.5195" x="38.2808" y="174.2231">POST /admin/upstreams {mcp servers + headers}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="11" id="msg4"><polygon fill="#181818" points="708.1211,204.4219,718.1211,208.4219,708.1211,212.4219,712.1211,208.4219" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="208.4219" y2="208.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.3208" x="391.8003" y="203.356">(federates user's MCP servers, with credentials)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="12" id="msg5"><polygon fill="#181818" points="372.8003,233.5547,382.8003,237.5547,372.8003,241.5547,376.8003,237.5547" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="237.5547" y2="237.5547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.2676" x="38.2808" y="232.4888">POST /admin/grant {grant, names}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="13" id="msg6"><polygon fill="#181818" points="708.1211,262.6875,718.1211,266.6875,708.1211,270.6875,712.1211,266.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="266.6875" y2="266.6875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6587" x="391.8003" y="261.6216">(hand then pulls values &#8212; see seq-vault-grant)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" data-source-line="14" id="msg7"><line style="stroke:#181818;stroke-width:1;" x1="720.1211" x2="762.1211" y1="295.8203" y2="295.8203"/><line style="stroke:#181818;stroke-width:1;" x1="762.1211" x2="762.1211" y1="295.8203" y2="308.8203"/><line style="stroke:#181818;stroke-width:1;" x1="721.1211" x2="762.1211" y1="308.8203" y2="308.8203"/><polygon fill="#181818" points="731.1211,304.8203,721.1211,308.8203,731.1211,312.8203,727.1211,308.8203" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1694" x="727.1211" y="290.7544">adminAuthed(): compare Bearer to HAND_ADMIN_TOKEN</text></g><path d="M650,321.8203 L650,436.8203 L1174,436.8203 L1174,331.8203 L1164,321.8203 L650,321.8203" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><path d="M1164,321.8203 L1164,331.8203 L1174,331.8203 L1164,321.8203" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.644" x="663.5474" y="338.8872">The token is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="172.5547" x="747.3237" y="338.8872">the same in every hand</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.084" x="924.0107" y="338.8872">(one Secret, mounted everywhere)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.8159" x="663.5474" y="354.02">and it is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="192.8228" x="719.4956" y="354.02">also the grant-signing key</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.6138" x="916.4507" y="354.02">(serve.go:174).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="29.8022" x="663.5474" y="369.1528">With</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="162.5063" x="697.4819" y="369.1528">no NetworkPolicy (F5)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="269.0645" x="859.9883" y="369.1528">, model-generated code in one hand can:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.5566" x="667.6797" y="384.2856">1. read its own env &#8594; obtain the token,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.4263" x="667.6797" y="399.4185">2. reach h-&lt;other&gt; directly &#8594; drive another session's admin plane,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2295" x="667.6797" y="414.5513">3. sign its own grants &#8594; pull ANY user's vault credentials.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.2402" x="663.5474" y="429.6841">Fix: separate keys + per-session tokens + ActorIdentity binding.</text><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="25" id="msg8"><polygon fill="#CC0000" points="1094.2905,459.8828,1104.2905,463.8828,1094.2905,467.8828,1098.2905,463.8828" style="stroke:#CC0000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#CC0000;stroke-width:1;stroke-dasharray:2,2;" x1="720.1211" x2="1100.2905" y1="463.8828" y2="463.8828"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.6309" x="727.1211" y="458.8169">lateral movement (possible today)</text></g><?plantuml-src VLFRQjj047tNLmp9GorgEKsJKX36u2Os2IME8O5IcXBMsecrHDfLTrToHIZagHzG-Wtzi7n9PqTshX0_M68rvyoPCsUzyWN2aT0IX2oLXgeG6k7kzYyOUhfSM9JWpJLgk38Mi47RGXxgUzEzE8egORtAL2MqXos7ji4j40xuxUb7uL6ZXzv4DwQDB_IHSJx9KKYqO4tjbLuob8gU0hbRdWoTaYEk20VFkBNnEV4uT4uP_QQhkT24uWyTZb-ZYBL1CWgT88NvwTavxF3qEqgYzigt03ThgZw8p1lxAmh5X64nAGJnwKRKG2m9vkvk_xt6NLVEMnIbWviogpg7h8Etq7dWdhVeNI4TasiEQYgccKuEvXjO7rRAvv3HTe9YKRZujTvB6sowuKSVj2ZnPJj-aaEKWRee73IYgAbtY893YWB-I1fH5pvXbZZY-WSyDnhNH21xSGgPAMb329-G_Yqb28x6iyFByU79yUpo_FJpP1P5j3G4G-CmHx_R3snFfvFzoNu4S9xZEdhAmN0ne