 style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;" x1="1105.377" x2="1105.377" y1="89.8906" y2="512.1484"/></g></g><g class="participant participant-head" data-entity-uid="part1" data-qualified-name="serve" data-source-line="3" id="part1-head"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="52.5615" x="5" y="58.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.5615" x="12" y="78.5889">serve</text></g><g class="participant participant-tail" data-entity-uid="part1" data-qualified-name="serve" data-source-line="3" id="part1-tail"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="52.5615" x="5" y="511.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="38.5615" x="12" y="531.1436">serve</text></g><g class="participant participant-head" data-entity-uid="part2" data-qualified-name="net" data-source-line="4" id="part2-head"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="155.0322" x="307.2842" y="42.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.8857" x="332.8574" y="62.292">atenet (Envoy)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.0322" x="314.2842" y="78.5889">Host-header routing</text></g><g class="participant participant-tail" data-entity-uid="part2" data-qualified-name="net" data-source-line="4" id="part2-tail"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="155.0322" x="307.2842" y="511.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="103.8857" x="332.8574" y="531.1436">atenet (Envoy)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="141.0322" x="314.2842" y="547.4404">Host-header routing</text></g><g class="participant participant-head" data-entity-uid="part3" data-qualified-name="hand" data-source-line="5" id="part3-head"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.1182" x="664.562" y="58.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1182" x="671.562" y="78.5889">hand h-&lt;sid&gt;</text></g><g class="participant participant-tail" data-entity-uid="part3" data-qualified-name="hand" data-source-line="5" id="part3-tail"><rect fill="#E2E2F0" height="30.2969" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111.1182" x="664.562" y="511.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97.1182" x="671.562" y="531.1436">hand h-&lt;sid&gt;</text></g><g class="participant participant-head" data-entity-uid="part4" data-qualified-name="other" data-source-line="6" id="part4-head"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="175.8271" x="1018.377" y="42.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.8271" x="1025.377" y="62.292">another session's hand</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.6826" x="1068.9492" y="78.5889">h-&lt;other&gt;</text></g><g class="participant participant-tail" data-entity-uid="part4" data-qualified-name="other" data-source-line="6" id="part4-tail"><rect fill="#E2E2F0" height="46.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="175.8271" x="1018.377" y="511.1484"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="161.8271" x="1025.377" y="531.1436">another session's hand</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="74.6826" x="1068.9492" y="547.4404">h-&lt;other&gt;</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="8" id="msg1"><polygon fill="#181818" points="372.8003,117.0234,382.8003,121.0234,372.8003,125.0234,376.8003,121.0234" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="121.0234" y2="121.0234"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252.1924" x="38.2808" y="115.9575">POST /admin/identity  {session, actor}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="9" id="msg2"><polygon fill="#181818" points="708.1211,146.1563,718.1211,150.1563,708.1211,154.1563,712.1211,150.1563" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="150.1563" y2="150.1563"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="152.9214" x="391.8003" y="145.0903">Host: h-&lt;sid&gt;.agents&#8230;</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="10" id="msg3"><polygon fill="#181818" points="372.8003,175.2891,382.8003,179.2891,372.8003,183.2891,376.8003,179.2891" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="179.2891" y2="179.2891"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="329.5195" x="38.2808" y="174.2231">POST /admin/upstreams {mcp servers + headers}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="11" id="msg4"><polygon fill="#181818" points="708.1211,204.4219,718.1211,208.4219,708.1211,212.4219,712.1211,208.4219" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="208.4219" y2="208.4219"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311.3208" x="391.8003" y="203.356">(federates user's MCP servers, with credentials)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" data-source-line="12" id="msg5"><polygon fill="#181818" points="372.8003,233.5547,382.8003,237.5547,372.8003,241.5547,376.8003,237.5547" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="31.2808" x2="378.8003" y1="237.5547" y2="237.5547"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.2676" x="38.2808" y="232.4888">POST /admin/grant {grant, names}</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" data-source-line="13" id="msg6"><polygon fill="#181818" points="708.1211,262.6875,718.1211,266.6875,708.1211,270.6875,712.1211,266.6875" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="384.8003" x2="714.1211" y1="266.6875" y2="266.6875"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305.6587" x="391.8003" y="261.6216">(hand then pulls values &#8212; see seq-vault-grant)</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" data-source-line="14" id="msg7"><line style="stroke:#181818;stroke-width:1;" x1="720.1211" x2="762.1211" y1="295.8203" y2="295.8203"/><line style="stroke:#181818;stroke-width:1;" x1="762.1211" x2="762.1211" y1="295.8203" y2="308.8203"/><line style="stroke:#181818;stroke-width:1;" x1="721.1211" x2="762.1211" y1="308.8203" y2="308.8203"/><polygon fill="#181818" points="731.1211,304.8203,721.1211,308.8203,731.1211,312.8203,727.1211,308.8203" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1694" x="727.1211" y="290.7544">adminAuthed(): compare Bearer to HAND_ADMIN_TOKEN</text></g><path d="M650,321.8203 L650,467.8203 L1174,467.8203 L1174,331.8203 L1164,321.8203 L650,321.8203" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><path d="M1164,321.8203 L1164,331.8203 L1174,331.8203 L1164,321.8203" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="79.644" x="662.9285" y="338.8872">The token is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="172.5547" x="746.7048" y="338.8872">the same in every hand</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.084" x="923.3918" y="338.8872">(one Secret, mounted everywhere)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="51.8159" x="662.9285" y="354.02">and it is</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="192.8228" x="718.8767" y="354.02">also the grant-signing key</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="99.6138" x="915.8318" y="354.02">(serve.go:174).</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="239.5605" x="662.9285" y="369.1528">Substrate NetworkPolicies now block</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="59.7632" x="906.6213" y="369.1528">inbound</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="136.0366" x="970.5168" y="369.1528">actor-to-actor traffic,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="21.5884" x="662.9285" y="384.2856">but</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="195.0063" x="688.6492" y="384.2856">egress is unrestricted (F5)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264.9258" x="887.7878" y="384.2856">&#8212; so model-generated code in one hand</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="103.9365" x="662.9285" y="399.4185">can still initiate:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255.5566" x="667.0608" y="414.5513">1. read its own env &#8594; obtain the token,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438.4263" x="667.0608" y="429.6841">2. reach h-&lt;other&gt; directly &#8594; drive another session's admin plane,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="373.2295" x="667.0608" y="444.8169">3. sign its own grants &#8594; pull ANY user's vault credentials.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="420.2402" x="662.9285" y="459.9497">Fix: separate keys + per-session tokens + ActorIdentity binding.</text><g class="message" data-entity-1="part3" data-entity-2="part4" data-source-line="27" id="msg8"><polygon fill="#CC0000" points="1094.2905,490.1484,1104.2905,494.1484,1094.2905,498.1484,1098.2905,494.1484" style="stroke:#CC0000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#CC0000;stroke-width:1;stroke-dasharray:2,2;" x1="720.1211" x2="1100.2905" y1="494.1484" y2="494.1484"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="224.6309" x="727.1211" y="489.0825">lateral movement (possible today)</text></g><?plantuml-src VPJTQjj048NlzHH3Sr6BMaxJf1H4CBX9J4A94qXkIbF2IXfRYzUxxkxAhWc5NFK1If-X3vOdwTcLdLz8BYAncZapS-PRU-aLqx7G5Obg9ZNDbT1CTxT_oU3fQc6v8c-ch6biBF62xOhg4DyPxgP9CXVMorBEXVRqnh5Ty1iIZkBRqu_2isPFdIEzCAlqIXyRvxEQHSMMh6cyr9EOYg2dYR5QdUqxMVLZH3XufgsDhw7Zs3bfzDisvaeZAtvey-9haiJUAEk7IfJJ-Td59Mt7wRTbnTfBloAwMKjrIPJUs5z924PER2Qdq7o-QQed9aXpTxV_NjDkvivR5ZD7DxDotZfa7RsZrWFtl4Hdp3Y6QuuQ16EcquFpJLgNbjBNL68xeMEXNFfQxOaDDjt4HvUqcF7BSl49Xy10evIZXL0DQWSK70C5_f4jHADy5bNI9CO_vCT2WmO2LIVDgJGpR8ZfC-E_1K5qF1WTNWyEJqz6rvTdNuv6IOAbCHcC4pMwxNveQpWysZlQIuWkQrwZ9ntj5try9eVU2Pm-WBY_NVIf4sYzOFY1-MQcqHxOnfWbD3c5McXJ-hKK33DXM8h3P4vEDFYZAQzQkUXbRsBodKzxQG_P5qs1zM4RD6A_D7PwRXJmWq7QBAbGffm6NQaB56zxYk1atcJnXP0z7iko2x6YyI6O9nQGXOuQZJTlPHdQxWm_fb4WMcymJiKg0sAHXWhMLj62C7Ay2aIbqEIyL0hd4ZXupd5AEpq2SM5imB-4QNf1Tx__a2cyW83V-1jweWynkApf_j9G9IsNNgrYKcKby7fvqnxzRaITtHu5E--BHeTTb0XWqM3qTGDqvEannC7feVoPGnxq1BUnaN17vcopTScsvN0u2BwURAvi8NM57VOIng83Mcj2lsqT7Bp7ttUmslQUauAq5GhMBdY6VEhC3SGB5Gofn2hz3m00?></g></svg>