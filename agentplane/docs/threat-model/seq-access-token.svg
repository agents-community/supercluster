" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="417.4536" x2="700.0596" y1="193.9922" y2="193.9922"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="102.9209" x="424.4536" y="188.9263">allowed(email)?</text></g><path d="M10,208.9922 L74.4429,208.9922 L74.4429,216.125 L64.4429,226.125 L10,226.125 L10,208.9922" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="286.8047" style="stroke:#000000;stroke-width:1.5;" width="1013.8218" x="10" y="208.9922"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="19.4429" x="25" y="222.0591">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="101.895" x="89.4429" y="221.2026">[not allowlisted]</text><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="11" id="msg3"><polygon fill="#181818" points="125.0742,243.2578,115.0742,247.2578,125.0742,251.2578,121.0742,247.2578" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="119.0742" x2="416.4536" y1="247.2578" y2="247.2578"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.0356" x="131.0742" y="242.1919">403 (denial logged &#8212; the only signal)</text></g><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="10" x2="1023.8218" y1="256.2578" y2="256.2578"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="77.4189" x="15" y="266.4683">[allowlisted]</text><g class="message" data-entity-1="part2" data-entity-2="part4" data-source-line="13" id="msg4"><polygon fill="#181818" points="897.3765,287.1953,907.3765,291.1953,897.3765,295.1953,901.3765,291.1953" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="417.4536" x2="903.3765" y1="291.1953" y2="291.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="84.3604" x="424.4536" y="286.1294">loadTokens()</text></g><path d="M20,306.1953 L84.4429,306.1953 L84.4429,313.3281 L74.4429,323.3281 L20,323.3281 L20,306.1953" fill="#EEEEEE" style="stroke:#000000;stroke-width:1.5;"/><rect fill="none" height="182.6016" style="stroke:#000000;stroke-width:1.5;" width="993.8218" x="20" y="306.1953"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="19.4429" x="35" y="319.2622">alt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="172.5356" x="99.4429" y="318.4058">[token exists for this email]</text><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="15" id="msg5"><polygon fill="#181818" points="125.0742,351.0273,115.0742,355.0273,125.0742,359.0273,121.0742,355.0273" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="119.0742" x2="416.4536" y1="355.0273" y2="355.0273"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="189.9409" x="131.0742" y="349.9614">the SAME token as before</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="85.3062" x="325.1475" y="349.9614">(idempotent)</text></g><path d="M422,328.3281 L422,368.3281 L762,368.3281 L762,338.3281 L752,328.3281 L422,328.3281" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M752,328.3281 L752,338.3281 L762,338.3281 L752,328.3281" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="244.2896" x="428" y="345.395">an attacker who knows an allowlisted</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="319.9727" x="428" y="360.5278">address gets the legitimate user's live token (F7)</text><line style="stroke:#000000;stroke-width:1;stroke-dasharray:2,2;" x1="20" x2="1013.8218" y1="374.5938" y2="374.5938"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="700" lengthAdjust="spacing" textLength="67.6221" x="25" y="384.8042">[first time]</text><g class="message" data-entity-1="part2" data-entity-2="part2" data-source-line="18" id="msg7"><line style="stroke:#181818;stroke-width:1;" x1="417.4536" x2="459.4536" y1="409.5313" y2="409.5313"/><line style="stroke:#181818;stroke-width:1;" x1="459.4536" x2="459.4536" y1="409.5313" y2="422.5313"/><line style="stroke:#181818;stroke-width:1;" x1="418.4536" x2="459.4536" y1="422.5313" y2="422.5313"/><polygon fill="#181818" points="428.4536,418.5313,418.4536,422.5313,428.4536,426.5313,424.4536,422.5313" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="274.606" x="424.4536" y="404.4653">newToken() = "apl_" + 24B crypto/rand  &#9989;</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" data-source-line="19" id="msg8"><polygon fill="#181818" points="897.3765,447.6641,907.3765,451.6641,897.3765,455.6641,901.3765,451.6641" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="417.4536" x2="903.3765" y1="451.6641" y2="451.6641"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="87.0073" x="424.4536" y="446.5981">saveTokens()</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" data-source-line="20" id="msg9"><polygon fill="#181818" points="125.0742,476.7969,115.0742,480.7969,125.0742,484.7969,121.0742,480.7969" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;" x1="119.0742" x2="416.4536" y1="480.7969" y2="480.7969"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67.8184" x="131.0742" y="475.731">new token</text></g><path d="M27,507.7969 L27,592.7969 L995,592.7969 L995,517.7969 L985,507.7969 L27,507.7969" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><path d="M985,507.7969 L985,517.7969 L995,517.7969 L985,507.7969" fill="#FFE4E4" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.9258" x="299.2029" y="524.8638">F7</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="397.4902" x="317.1287" y="524.8638">: rate-limited now (10/min per IP, 5/min per email) &#8212; but still</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="367.5103" x="299.2029" y="539.9966">no second factor, so email alone remains the credential.</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="17.9258" x="299.2029" y="555.1294">F1</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230.3374" x="317.1287" y="555.1294">: the resulting token can read/write</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="700" lengthAdjust="spacing" textLength="89.4575" x="551.5984" y="555.1294">every user's</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="59.0269" x="645.1882" y="555.1294">sessions,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="344.646" x="299.2029" y="570.2622">because no route compares the session to its owner.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="407.6338" x="299.2029" y="585.395">Verification is constant-time &#9989; (subtle.ConstantTimeCompare).</text><?plantuml-src RLJDRXCn4BxlKuos1tP5DsbBK54K0YLgL0wbbHfnYeGSxsHZnMklx4dI225nWGT077cwFWbZxwe_b4Wvf9xvvlkPAIdI23UebuL7jrKIGKY9tWy1Qw4q2AtjJYjFSFVp5pJel3L2mmA5GmTarsYIH4Yo3j8pixS6mHgW5O8oXCuWfI0yx5OsQOGZ9LKZ344Qfk7SN5_TpA2_FUwtKo7xT3LZy9Ko9OWDhVBO7OkVza-iMQhgKZGjGooBoDVFJRQoL3ZKLfHOjlsoVjgyVkDPitH8SoCgDDHeOJ0wW4NKvBkvCacOEXJZbWCCuMiQ1wN3T6ytxwLrJK_QElqsDoDfjNN3WydaY3_ZqM8iDTj4U4jmCPjTGpOzoKVznNZKZvNZfCLaS5apSYSaY_ZvkqHe0cFf8G8i4-Xu5DmKY0rXSFGAiXADubIqhIeiuUxxxvY0DNeFNbKSM9wWzlX_gA1DCb9mR1R5Ppc_Xl7H2y1Rxl2mv8nffNox6Lpnd0nh3eDlpYxFkrvsSO7SYK4uPAh4kh74bkSHWFKXE5MjA1Z0vKH2hdcp0jxQs9sFVtsWpO6LfGkhKY5p2jCqLefKBHXfmuHUUD2AMRNpi-bfc1JLBvNZFUPIV4p-8Lg3kwW_o-4jfABHNr9u2IU33o3TlY7RTuBN4kx-_FYtFzZdnHOVsVVS78Rl3eRvc389toGQOBUjuiC8TJ2TdW_E1rp5TavFWt53S2olqAfMx06xjeFi-AXVAnDE4ZvU7yBh-r_j_iGjM6m8F2aTqZ8se5jMi8ptoiFi_P67ktNXXsazvTlWdI9Ugbx7uxZb4HxP_eqcPQhEOyaHEHHbV-UONgX65hJlqeZ1UqvCMUCF6Ms1Kl1J8EJiXXluVlWyiPtSLJ8qA0xOxWowmE4pEhLKKb1uv2La9PxucekGPyW4ChzPy7-ptgHxcV73f8NEUy7jk6r_0G00?></g></svg>