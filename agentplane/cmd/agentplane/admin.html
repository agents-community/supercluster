<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentplane · fleet</title>
<style>
  /* One session is one card, and a card holds BOTH halves of a split agent.
     The pairing is the point: a brain without its hand answers normally and
     fails every tool call, so the missing half has to be visible at a glance
     rather than inferred from two rows that happen to be adjacent. */
  :root {
    --bg: #0c0f14; --panel: #141922; --panel-2: #1b2230; --line: #232c3b;
    --ink: #e6ecf5; --ink-dim: #8a97ab; --ink-faint: #5b6779;
    --brain: #57c7ff; --hand: #b48cff;
    --ok: #4ade80; --sleep: #6b7a90; --warn: #fbbf24; --bad: #f87171;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe4ec;
      --ink: #10151d; --ink-dim: #5a6577; --ink-faint: #8b95a5;
      --brain: #0a6ea8; --hand: #6b3fc4;
      --ok: #14833f; --sleep: #77839a; --warn: #a86800; --bad: #c02626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0f14; --panel: #141922; --panel-2: #1b2230; --line: #232c3b;
    --ink: #e6ecf5; --ink-dim: #8a97ab; --ink-faint: #5b6779;
    --brain: #57c7ff; --hand: #b48cff;
    --ok: #4ade80; --sleep: #6b7a90; --warn: #fbbf24; --bad: #f87171;
  }
  :root[data-theme="light"] {
    --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f6; --line: #dfe4ec;
    --ink: #10151d; --ink-dim: #5a6577; --ink-faint: #8b95a5;
    --brain: #0a6ea8; --hand: #6b3fc4;
    --ok: #14833f; --sleep: #77839a; --warn: #a86800; --bad: #c02626;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  h1 .dim { color: var(--ink-faint); font-weight: 400; }
  .sub { color: var(--ink-dim); font-size: 13px; margin: 0 0 22px; }

  /* Live indicator: a quiet pulse, because a stale dashboard that looks fresh
     is worse than one that admits it is stale. */
  .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-dim); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .dot.beat { animation: beat 2s ease-in-out infinite; }
  .dot.stale { background: var(--warn); animation: none; }
  .dot.err { background: var(--bad); animation: none; }
  @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot.beat { animation: none; } }

  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 14px; display: flex; align-items: baseline; gap: 8px;
  }
  .stat b { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-dim); font-size: 12px; }
  .stat.alert { border-color: var(--warn); }
  .stat.alert b { color: var(--warn); }
  .spacer { flex: 1; }
  input[type=search], select, button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 11px; font: inherit; font-size: 13px;
  }
  input[type=search] { min-width: 210px; }
  button { cursor: pointer; }
  button:hover, select:hover { border-color: var(--ink-faint); }
  :focus-visible { outline: 2px solid var(--brain); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 15px; display: flex; flex-direction: column; gap: 10px;
  }
  .card.orphan { border-color: var(--warn); }
  .card-head { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .sid { font-size: 12.5px; color: var(--ink-dim); }
  .owner { font-size: 12px; color: var(--ink-faint); max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .half { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; background: var(--panel-2); }
  .half.missing { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
  .role { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 650; min-width: 42px; }
  .role.brain { color: var(--brain); }
  .role.hand  { color: var(--hand); }
  .agent { font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .agent .v { color: var(--ink-faint); }

  /* Status is encoded in shape as well as colour, so it survives being
     printed, screenshotted in greyscale, or read by someone colourblind. */
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    border: 1px solid currentColor; font-weight: 600;
  }
  .pill.running { color: var(--ok); }
  .pill.idle { color: var(--brain); }
  .pill.sleeping { color: var(--sleep); }
  .pill.unreachable, .pill.failed { color: var(--bad); }
  .pill.other { color: var(--ink-dim); }

  .empty, .gate { text-align: center; padding: 56px 20px; color: var(--ink-dim); }
  .gate form { display: inline-flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; justify-content: center; }
  .gate input { min-width: 300px; }
  .err { color: var(--bad); margin-top: 10px; font-size: 13px; }
  footer { margin-top: 26px; color: var(--ink-faint); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>agentplane <span class="dim">/ fleet</span></h1>
    <span class="live"><span id="beat" class="dot beat"></span><span id="livetext">connecting…</span></span>
  </header>
  <p class="sub">Every brain and hand running in the cluster, paired by session.</p>

  <div id="gate" class="gate" hidden>
    <div>This console needs an admin token.</div>
    <form id="tokform">
      <input type="password" id="tok" placeholder="apl_… (andromeda whoami)" autocomplete="off">
      <button type="submit">Connect</button>
    </form>
    <div class="err" id="gateerr"></div>
  </div>

  <main id="app" hidden>
    <div class="bar">
      <div class="stat"><b id="n-sessions">0</b><span>sessions</span></div>
      <div class="stat"><b id="n-running">0</b><span>running</span></div>
      <div class="stat"><b id="n-sleeping">0</b><span>sleeping</span></div>
      <div class="stat alert" id="stat-orphan" hidden><b id="n-orphan">0</b><span>orphaned hands</span></div>
      <div class="spacer"></div>
      <input type="search" id="q" placeholder="filter by session, agent, owner…" aria-label="Filter">
      <select id="probe" aria-label="Health probing">
        <option value="">status: registry</option>
        <option value="true">status: probe live</option>
      </select>
      <button id="signout" title="Forget the token in this tab">Sign out</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>Nothing running.</div>
    <footer id="foot"></footer>
  </main>
</div>

<script>
// Token lives in sessionStorage, not localStorage: an admin token that outlives
// the tab is a credential left on a shared machine.
const KEY = "agentplane.admin.token";
const $ = (id) => document.getElementById(id);
let token = sessionStorage.getItem(KEY) || "";
let timer = null, failures = 0;

function showGate(msg) {
  $("gate").hidden = false; $("app").hidden = true;
  $("gateerr").textContent = msg || "";
  setLive("err", msg ? "not connected" : "waiting for a token");
  if (timer) { clearInterval(timer); timer = null; }
}
function setLive(kind, text) {
  const d = $("beat");
  d.className = "dot" + (kind === "ok" ? " beat" : kind === "stale" ? " stale" : " err");
  $("livetext").textContent = text;
}

$("tokform").addEventListener("submit", (e) => {
  e.preventDefault();
  token = $("tok").value.trim();
  if (!token) return;
  sessionStorage.setItem(KEY, token);
  start();
});
$("signout").addEventListener("click", () => {
  sessionStorage.removeItem(KEY); token = "";
  showGate("");
});
$("q").addEventListener("input", render);
$("probe").addEventListener("change", () => { load(); });

let actors = [];

async function load() {
  const probe = $("probe").value === "true" ? "?probe=true" : "";
  try {
    const res = await fetch("/v1/admin/actors" + probe, {
      headers: { Authorization: "Bearer " + token },
    });
    if (res.status === 401) return showGate("That token is not valid.");
    // The API answers 404 for non-admins on purpose — it does not reveal that
    // the route exists. Say what that means rather than showing "not found".
    if (res.status === 404) return showGate("This account is not an admin on this cluster.");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    actors = data.actors || [];
    failures = 0;
    setLive("ok", "live · " + new Date().toLocaleTimeString());
    $("gate").hidden = true; $("app").hidden = false;
    render();
  } catch (e) {
    // Keep showing the last good data, but stop claiming it is current.
    failures++;
    setLive("stale", `stale · retrying (${failures})`);
  }
}

function bySession(list) {
  const m = new Map();
  for (const a of list) {
    if (!m.has(a.session)) m.set(a.session, { session: a.session, owner: a.owner || "", brain: null, hand: null });
    m.get(a.session)[a.role] = a;
  }
  return [...m.values()].sort((x, y) => x.session.localeCompare(y.session));
}

const pill = (s) => {
  const known = ["running", "idle", "sleeping", "unreachable", "failed"];
  const cls = known.includes(s) ? s : "other";
  return `<span class="pill ${cls}">${s}</span>`;
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const agentLabel = (a) => a ? esc(a.agent) + (a.version ? ` <span class="v">v${a.version}</span>` : "") : "";

function half(a, role) {
  if (!a) {
    return `<div class="half missing"><span class="role ${role}">${role}</span>
      <span class="agent">no ${role} actor</span></div>`;
  }
  return `<div class="half"><span class="role ${role}">${role}</span>
    <span class="agent">${agentLabel(a)}</span>${pill(a.status)}</div>`;
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const groups = bySession(actors).filter((g) =>
    !q || g.session.toLowerCase().includes(q) || g.owner.toLowerCase().includes(q) ||
    (g.brain && g.brain.agent.toLowerCase().includes(q)) || (g.hand && g.hand.agent.toLowerCase().includes(q)));

  const orphans = groups.filter((g) => !g.brain).length;
  $("n-sessions").textContent = groups.length;
  $("n-running").textContent = groups.filter((g) => g.brain && (g.brain.status === "running" || g.brain.status === "idle")).length;
  $("n-sleeping").textContent = groups.filter((g) => g.brain && g.brain.status === "sleeping").length;
  $("stat-orphan").hidden = orphans === 0;
  $("n-orphan").textContent = orphans;

  $("empty").hidden = groups.length > 0;
  $("grid").innerHTML = groups.map((g) => `
    <div class="card${!g.brain ? " orphan" : ""}">
      <div class="card-head">
        <span class="sid mono">${esc(g.session)}</span>
        <span class="owner" title="${esc(g.owner)}">${esc(g.owner) || "—"}</span>
      </div>
      ${half(g.brain, "brain")}
      ${half(g.hand, "hand")}
    </div>`).join("");

  $("foot").textContent = `${actors.length} actor(s) across ${bySession(actors).length} session(s)`
    + (orphans ? ` · ${orphans} hand(s) with no brain — leaked, see issue #71` : "");
}

function start() {
  if (timer) clearInterval(timer);
  load();
  // 10s: fast enough that "is it awake yet" is answerable, slow enough that a
  // console left open overnight is not a load source.
  timer = setInterval(load, 10000);
}

if (token) start(); else showGate("");
</script>
</body>
</html>
