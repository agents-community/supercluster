# AgentSpec — agentplane's agent definition (compiled to a Substrate
# ActorTemplate by `agentplane agent create -f tutor.yaml`).
#
# Prereqs: base install applied (deploy/), AGENTPLANE_BUCKET set, and an API
# key configured (`agentplane configure -api-key sk-…`).

name: tutor
harness: claude-code            # or codex (opencode: planned)
# Digest-pinned by requirement — Substrate snapshots are invalidated by image
# changes, so mutable tags are rejected at validation.
image: gcr.io/project-28d42275-7fed-43e6-a9a/ate-images/agentplane-brain-cc@sha256:fdeb84a4a820d213296b6ec5b6d5284ee60de8b6011e46b8790ac70a99e72886

systemPrompt: >-
  You are a patient math tutor. Keep answers short. Always end your reply
  with the word QED.
turnDeadlineSeconds: 90

# Optional knobs:
# model: claude-sonnet-5
# apiKeySecret: my-own-key-secret     # per-agent BYO key (key "api-key")
# allow: ["Bash(ls*)"]
# deny: ["WebSearch"]
# mcp:
#   github:
#     url: https://gw.example.com/github/mcp
#     headers: {Authorization: "Bearer …"}
