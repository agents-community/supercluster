# A pi-harness agent — ONE harness, ANY model provider. The model's
# "provider/" prefix decides which API key the compiler wires in
# (anthropic → ANTHROPIC_API_KEY, openai → OPENAI_API_KEY,
#  google → GEMINI_API_KEY; configure with `agentplane configure -provider …`).
# Change ONLY the model line to move this agent to a different vendor.

name: pi
harness: pi

model: anthropic/claude-haiku-4-5   # or openai/gpt-5, google/gemini-2.5-pro, …
systemPrompt: >-
  You are a terse, helpful agent. Answer directly.
turnDeadlineSeconds: 120

allow: [Bash, Read]                  # translated to pi's tools (bash, read);
                                     # empty allow = chat-only (noTools)
workspace:
  durable: true
