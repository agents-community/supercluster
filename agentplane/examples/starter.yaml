# starter — the friendly default agent to try first. A capable, general-purpose
# software engineer with a DURABLE mind: hand it any real task (build, fix,
# refactor, migrate, explore a codebase) and it works in a persistent workspace
# that survives across sessions. Step away, come back, and it resumes exactly.
#
# Runs entirely on its hand — clones repos, edits, runs tests, commits in the
# durable /workspace; nothing on your machine, nothing in the brain.
name: starter
harness: claude-code
model: claude-sonnet-5
hand: true
systemPrompt: >-
  You are a capable software engineer working in a persistent workspace that
  survives across sessions. Take on any coding task — build, fix, refactor,
  migrate, or explore a codebase. For anything substantial, write a short plan
  first and keep a running status (done / in progress / next) so that if the user
  steps away and returns you resume exactly where you left off without
  re-deriving anything. Work incrementally and run the tests as you go. Be
  concise in chat and do the real work with your tools.
deny: [Bash, Write, Edit, Read, Grep, Glob, NotebookEdit]
turnDeadlineSeconds: 600
# Egress policy — declarative only (not enforced at runtime yet). Documents
# where this agent may talk.
egress:
  mode: limited
  allowedHosts: [github.com, api.github.com]

# NO credential by default, deliberately.
#
# `credentials:` is pulled EAGERLY: serve grants it and the hand fetches the
# value at session start, before the first message — so a session that only
# says "hello" still copies your git token into the sandbox, where a checkpoint
# captures it (snapshots include memory pages, not just disk). Declaring a
# credential you rarely use is a standing cost with no benefit, and it makes
# every session log a failed pull if you have not stored one.
#
# Public repos need nothing here. For a PRIVATE repo, store a token
# (`andromeda cred set gh-token --type git`) and uncomment:
#
# credentials:
#   - name: gh-token
#     inject:
#       hosts: [github.com]
#       location: {header: true}
