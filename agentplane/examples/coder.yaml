# A brain+hand agent: local execution INSIDE the same sandboxed actor.
# Tool policy is yours (allow/deny) — the platform only provides the gVisor
# boundary. Workspace lives at /workspace and is part of every checkpoint,
# so files survive suspend/resume exactly like the conversation does.

name: coder
harness: claude-code
image: gcr.io/project-28d42275-7fed-43e6-a9a/ate-images/agentplane-brain-cc@sha256:fdeb84a4a820d213296b6ec5b6d5284ee60de8b6011e46b8790ac70a99e72886

systemPrompt: >-
  You are a concise coding agent. You work in /workspace. Do what is asked,
  reply briefly.
turnDeadlineSeconds: 300        # tool turns run longer than chat turns

workspace:
  durable: true                 # /workspace = DurableDir: repos survive resumes
                                # as fs data, outside the memory image

allow:
  - Bash
  - Read
  - Write
  - Edit
  - Glob
  - Grep
# deny: []                      # your call, not ours
