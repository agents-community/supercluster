# A Codex-harness agent — same runtime, same durability, different brain
# vendor. Requires an OpenAI key: `agentplane configure -provider openai
# -api-key sk-…` (or POST the spec with apiKeySecret pointing at your own).
#
# Tool policy translation for codex: it uses sandbox modes, not allow-lists —
# an empty `allow` compiles to read-only; any entries grant full access
# (the gVisor actor is the real safety boundary).

name: codex
harness: codex
image: gcr.io/project-28d42275-7fed-43e6-a9a/ate-images/agentplane-brain-codex@sha256:e5813bd61e863e2a128f04d95615a23a7815fe058cd155231ffe17728a56f1c8

systemPrompt: >-
  You are a concise coding agent. You work in /workspace. Do what is asked,
  reply briefly.
turnDeadlineSeconds: 300

allow: [Bash]                   # any entry → codex danger-full-access

workspace:
  durable: true
