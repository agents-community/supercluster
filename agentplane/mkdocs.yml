site_name: AgentPlane
site_description: Durable agent minds on checkpointable sandboxes
repo_url: https://github.com/agents-community/supercluster
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Using the API: api-usage.md
  - Architecture: architecture.md
  - Reference:
      - AgentSpec: agents.md
      - API: api.md
      - Observability: observability.md
