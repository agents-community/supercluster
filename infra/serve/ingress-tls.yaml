# HTTPS for the public endpoint (threat-model F2). Until this is applied,
# bearer tokens and raw credentials (PUT /v1/credentials carries a PAT) cross
# the internet in cleartext.
#
# Status:
#   1. DONE — Cloud DNS zone `supercluster-dev` exists in this project, with
#      A api.supercluster.dev -> 136.68.213.85 (the reserved `agentplane-ip`).
#   2. TODO — register supercluster.dev and point the registrar's nameservers at:
#        ns-cloud-a1.googledomains.com. ... a4
#        (gcloud dns managed-zones describe supercluster-dev \
#           --format='value(nameServers)')
#   3. Apply this file, then watch the cert reach Active (~15-60 min):
#        kubectl -n agentplane describe managedcertificate agentplane-cert
#      A managed cert cannot provision until the domain resolves publicly, so
#      step 2 must land first — applying earlier just parks it Provisioning.
#   4. Verify BOTH: https:// works, and plain http:// is REFUSED (not
#      redirected — a redirect still leaks the bearer token in request one).
#   5. Rotate every token and stored credential afterwards: everything issued
#      so far has crossed the internet in cleartext.
#   6. Retire the nip.io host so no client silently keeps the cleartext path.
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: agentplane-cert
  namespace: agentplane
spec:
  domains: [api.supercluster.dev]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentplane
  namespace: agentplane
  annotations:
    networking.gke.io/managed-certificates: agentplane-cert
    # Refuse cleartext outright rather than redirecting: a redirect still
    # leaks the bearer token in the first request.
    kubernetes.io/ingress.allow-http: "false"
spec:
  rules:
  - host: api.supercluster.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentplane-serve
            port: { number: 7433 }
