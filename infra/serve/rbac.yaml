# Least-privilege identity for the in-cluster serve.
#
# serve manages agents by shelling out to kubectl against ActorTemplates, and
# talks to ateapi over gRPC (no k8s RBAC needed for that). It does NOT need
# Secret access — BYO-keys are ephemeral (never written to Secrets), and
# operator key config stays a CLI/`configure` task.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-serve
  namespace: agentplane
  # For transcript escrow to GCS, annotate with a Workload-Identity GSA:
  #   iam.gke.io/gcp-service-account: agentplane-serve@<project>.iam.gserviceaccount.com
  # (grant that GSA storage.objectAdmin on the snapshot bucket). Optional —
  # without it, escrow is skipped with a warning; all other ops work.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentplane-serve
  namespace: agentplane
rules:
- apiGroups: ["ate.dev"]
  resources: ["actortemplates"]
  verbs: ["get", "list", "watch", "create", "delete"]
# Self-service access (POST /v1/access) mints tokens into this one Secret.
# Scoped to the single resource by name — serve can read/update only it.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["agentplane-serve-tokens"]
  verbs: ["get", "update", "patch"]
# Session ownership registry (threat-model F1): serve records which user owns
# each session here. `create` needs no resourceName (the object may not exist
# yet); every other verb is pinned to this one ConfigMap.
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["agentplane-session-owners"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentplane-serve
  namespace: agentplane
subjects:
- kind: ServiceAccount
  name: agentplane-serve
  namespace: agentplane
roleRef:
  kind: Role
  name: agentplane-serve
  apiGroup: rbac.authorization.k8s.io
---
# The broker's own identity. It authenticates to serve's /v1/internal/exec with a
# projected token for this SA (F15) — no shared secret. No RBAC of its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentplane-broker
  namespace: agentplane
---
# serve verifies the broker's SA token with a k8s TokenReview. Creating
# TokenReviews is exactly the built-in system:auth-delegator ClusterRole — the
# standard way a service delegates authentication to the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentplane-serve-auth-delegator
subjects:
- kind: ServiceAccount
  name: agentplane-serve
  namespace: agentplane
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
