# The idle dispatcher — the multiplexing keystone. Sweeps every 30s and
# suspends minds idle >120s (escrow-first, never mid-turn), brain AND paired
# hand, so pool workers recycle and N workers serve many×N sessions.
#
# Same image + ServiceAccount as serve (same binary, same RBAC/WI); it's a
# control loop, not a data path — 1 replica, crash-and-restart is fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentplane-dispatcher
  namespace: agentplane
  labels: { app: agentplane-dispatcher }
spec:
  replicas: 1
  selector:
    matchLabels: { app: agentplane-dispatcher }
  template:
    metadata:
      labels: { app: agentplane-dispatcher }
    spec:
      serviceAccountName: agentplane-serve
      containers:
      - name: dispatcher
        image: gcr.io/project-28d42275-7fed-43e6-a9a/ate-images/agentplane-serve:v19  # same image as serve
        command: ["/usr/local/bin/agentplane"]
        args: ["dispatcher", "-idle-after=120s", "-interval=30s"]
        env:
        - { name: SUBSTRATE_ATEAPI, value: "api.ate-system.svc:443" }
        - { name: SUBSTRATE_ATENET, value: "atenet-router.ate-system.svc:80" }
        - { name: BRAIN_TEMPLATE_NS, value: "agentplane" }
        # escrow-before-suspend needs the snapshot bucket; set to the same
        # value as serve's AGENTPLANE_BUCKET on deploy.
        # Selects the GCP project for the credential vault (Secret Manager)
        # AND the session metadata store (Firestore, #36). Was set on the live
        # Deployment but missing here: apply preserved it only because 3-way
        # merge treats unmanaged keys as external, so the repo could not have
        # rebuilt this cluster — both would have silently degraded.
        - { name: AGENTPLANE_PROJECT, value: "project-28d42275-7fed-43e6-a9a" }
        - { name: AGENTPLANE_BUCKET, value: "snapshot-substrate-test-project-28d42275-7fed-43e6-a9a" }
        volumeMounts:
        # Same client auth as serve: Substrate's control plane rejects
        # unauthenticated gRPC clients, and without this the dispatcher fails
        # every pass with `Unauthenticated: missing bearer token` — auto-sleep
        # silently stops and pool workers are never reclaimed.
        - { name: ateapi-token, mountPath: /run/ateapi-token, readOnly: true }
        resources:
          requests: { cpu: 20m, memory: 64Mi }
          limits: { memory: 128Mi }
      volumes:
      - name: ateapi-token
        projected:
          sources:
          - serviceAccountToken:
              audience: api.ate-system.svc
              expirationSeconds: 3600
              path: token
